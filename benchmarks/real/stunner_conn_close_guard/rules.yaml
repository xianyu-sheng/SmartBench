version: smartbench.state-rules/v1
rules:
  - id: conn-close-guarded-before-any-use
    name: Network connection must be closed before use
    description: A connection returned by Connect must have its Close registered (defer) before the connection is used, so every error path and the success path release the socket.
    severity: error
    confidence: 1.0
    languages: [go]
    message: network connection must be closed before it is used
    invariant:
      scope: intraprocedural
      kind: require_guard_before_action
      event:
        kinds: [assign]
        contains_all: [internal.Connect]
      guard:
        kinds: [defer]
        contains_all: [remote.Close]
      action:
        kinds: [assign]
        contains_all: [sendAndReceive]
