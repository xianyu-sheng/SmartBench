[project]
name = "smartbench"
version = "0.6.0"
description = "LLM-powered universal code diagnostic platform — 14 languages, multi-agent debate, RAG + evidence verification"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Xianyu Sheng", url = "https://github.com/xianyu-sheng"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "anthropic>=0.8.0",
    "httpx>=0.25.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]
graph = [
    "tree-sitter>=0.21.0",
]
rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/xianyu-sheng/SmartBench"
Repository = "https://github.com/xianyu-sheng/SmartBench"
Issues = "https://github.com/xianyu-sheng/SmartBench/issues"

[project.scripts]
smartbench = "smartbench.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartbench"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
