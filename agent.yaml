name: smartbench
display_name: 证据驱动代码诊断工作台
description: |
  确定性仓库指纹、代码结构图、可选 RAG 检索、三角色 LLM 审查与本地证据核验
  组成的代码诊断工作台。证据核验确认引用位置，不承诺语义零误报。
protocol: cli
version: "0.6.1"

capabilities:
  tasks:
    - name: diagnose_code
      description: 对项目执行多角色代码审查，并核验结果引用的文件、行号与调用关系。
      input:
        project_path: "string — 本地项目路径或 Git URL"
        concern: "string — 希望重点检查的问题"
      output:
        suggestions: "list — 带证据状态的诊断建议"

    - name: fingerprint_project
      description: 不调用 LLM，识别项目语言、框架、构建系统、规模和 Git 信号。
      input:
        project_path: "string — 本地项目路径"
      output:
        fingerprint: "object — 确定性项目指纹"

  providers:
    - deepseek
    - openai
    - anthropic
    - glm
    - doubao
    - moonshot
    - qwen
    - openai_compatible_local

interface:
  command: smartbench quick --project "{project_path}" --concern "{goal}" --output report.json
